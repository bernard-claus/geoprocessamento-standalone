name: Build and Release

on:
  push:
    tags:
      - 'v*'   # Runs only when you push a version tag, e.g. v1.0.1
  workflow_dispatch:
    

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install pyinstaller

    - name: Build executable with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "Geoprocessamento_Gabriela_F" --icon "geo_proc.ico" --add-data "web/dist;web/dist" --add-data "api_class;api_class" main.py

    - name: Install Inno Setup
      run: choco install innosetup --yes

    - name: Compile installer with Inno Setup
      run: iscc build_installation_package.iss /dMyAppVersion=${{ github.ref_name }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: Output/*.exe   # Adjust to where your Inno script outputs

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: installer

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: installer/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
